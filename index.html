<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Animation Game</title>

    <link rel="stylesheet" href="styletech.css">
</head>

<body>

    <div class="container">

        <div class="sky">

            <div class="trees"></div>

            <div class="track"></div>

            <div class="car">

                <div class="wheel wheel1">
                    <img src="car_wheel_left.png" alt="Left Wheel">
                </div>

                <div class="wheel wheel2">
                    <img src="car_wheel_right.png" alt="Right Wheel">
                </div>

            </div>

        </div>

    </div>

    <script src="scripttech.js"></script>

</body>

</html>
